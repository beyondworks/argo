# 임시 진단 워크플로(브랜치 tmp/mutex-race-diag 전용, 진단이 끝나면 브랜치째 지운다) — 4차(시간 예산 30초 추가본):
# 고친 테스트(회차 동기화 + 제품 시간 설정)를 테스트 스위트 두 벌 부하에서 반복 실행한다. 2차에서 같은 부하로 기존 테스트는 20회 중 2회 실패.
name: tmp-mutex-race-diag

on:
  push:
    branches: [tmp/mutex-race-diag]

permissions:
  contents: read

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: win-sync-1 }
          - { os: windows-latest, name: win-sync-2 }
          - { os: macos-15, name: mac-sync }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: runner.os == 'Windows'
        run: node scripts/fetch-busybox.mjs bin
      - name: race test loop
        shell: bash
        env:
          DIAG_TEST_FILE: test/mutex-reclaim-race.test.mjs
        run: |
          node -e "const os=require('os'); console.log('node', process.version, 'os', os.release(), 'cpus', os.cpus().length, 'tmpdir', os.tmpdir())"
          node diag/diag-run.mjs . 25 ${{ matrix.name }} suite 2
