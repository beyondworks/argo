# 테스트 게이트 — 모든 push/PR에서 단위 테스트를 강제한다 (2026-07-27 안정화 프로그램 Phase 0).
#
# 왜 필요한가: 이 레포는 test/ 아래 340+ 케이스를 갖고도 그걸 돌리는 워크플로가 없어,
# 게이트가 전부 사람 프로세스(스킬·분리 검수)에 걸려 있었다. 최근 300커밋 중 fix가 42%인
# 구조의 근본 원인. 스모크 게이트가 러너 라벨 하드코딩으로 릴리스 4회를 무음 스킵한 전례
# (release.yml 주석 참고)처럼, 사람이 잊으면 끝나는 게이트는 게이트가 아니다.
#
# 매트릭스가 macOS + Windows인 이유: 데스크톱 앱이 실제로 배포되는 두 OS다. 특히 Windows는
# 신고 최다 환경(P0-1 11건 중 8건)인데 지금까지 CI에서 빌드만 하고 실행은 한 번도 안 했다.
# 레포는 public이라 두 러너 모두 무료다(과금 배율 무관).
#
# 주의: 이 워크플로는 단위 테스트만 본다. 신규 기기 스모크(원클릭)는 release.yml에서,
# 실자격 필요 계열(codex auth 반입 등)은 단위 테스트가 잠근다.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 레포 기본 토큰이 이미 read지만 조직/레포 기본값 변경에도 안전하게 고정(분리 검수 권고)
permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  # PR만 취소 — main push까지 취소하면 연속 푸시에서 앞 커밋이 판정 없이 사라진다(분리 검수 권고)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    # 행 방지 — 테스트가 자식 프로세스를 스폰하는 계열이 있어 hang 시 기본 6시간을 태우지 않게 상한.
    # 25분: 리스 넘겨받기 e2e(운영 주기 8초·TTL 120초 장면, #884)가 더해져 macOS 잡이 20분 근처까지 왔다(npm test 17~19분 + 스모크 1~1.5분).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # 윈도우: 테스트가 처음 띄우는 32비트 PowerShell·Chrome을 미리 기동해 둔다(이미지 디스크의 첫 읽기가 16~74초) — 설치 단계와 겹치게 백그라운드로.
      # 이 비용이 테스트 안에서 나면 nsis-hooks·K58 같은 시간 상한에 걸렸다(2026-10-01 실측, scripts/ci-windows-prewarm.ps1 주석).
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Start-Process pwsh -WindowStyle Hidden -ArgumentList '-NoProfile', '-File', 'scripts/ci-windows-prewarm.ps1'

      # Hermes adapter behavioral tests execute Python on every test platform.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # no-undef 게이트(전수리뷰 2026-07-30 #2) — 미정의 식별자(listAgents 임포트 누락·전권 전환 잔재
      # caps 참조 같은 무음 실패 클래스)를 커밋 시점에 잡는다. 규칙은 no-undef 하나(eslint.config.mjs).
      - run: npm run lint

      # 윈도우: Bash 도구의 POSIX sh(동봉 busybox UTF-8 빌드)를 해시 고정으로 레포 루트 bin/에 — 테스트가 실제 실행기(사다리의 cwd/bin 후보)로 돈다
      - if: runner.os == 'Windows'
        run: node scripts/fetch-busybox.mjs bin  # 레포 동봉본(vendor/)에서 해시 검증 뒤 복사 — 네트워크 없음

      # 윈도우: 예열이 끝날 때까지 기다리고(보통 설치 단계 동안 끝나 0초), 임시 폴더를 작업 드라이브(D:)로 옮긴다.
      # 실측(2026-10-01): 작은 파일 1,500개 쓰기·읽기·삭제가 기본 TEMP(C:)에서 2.5~48초, RUNNER_TEMP(D:)에서 0.4~0.7초 — 러너마다 C:가 크게 흔들려
      # 임시 폴더를 쓰는 테스트들이 시간 상한에 걸렸다. 전체 테스트는 D:에서 402~425초, C:에서 455~505초(예열 동일).
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'prewarm.log'
          for ($i = 0; $i -lt 300 -and -not (Select-String -Quiet -Path $log -Pattern '^done' -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          "prewarm waited ${i}s"; Get-Content $log -ErrorAction SilentlyContinue
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      # Windows에서도 glob이 동작한다 — cmd는 글롭 확장을 안 하지만 node --test가 패턴을 직접 해석(Node 21+)
      - run: npm test

      - name: Messenger version and production build
        shell: bash
        env:
          # Public placeholder config: CI verifies a configured frontend without live credentials.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-public-placeholder
        run: |
          node scripts/bump-version.mjs --root apps/messenger --check
          npm ci --prefix apps/messenger --no-audit --no-fund
          npm test --prefix apps/messenger
          npm run build --prefix apps/messenger
          node scripts/messenger-dist-smoke.mjs

      # 네이티브 엔진 산출물 검사(분리 검수 2026-09-05 NEW-HIGH-2·T8) — 소스만 임포트하는 스위트가 못 보는 축: webpack이 워커 URL을
      # 청크 에셋으로 재작성해 프로덕션·standalone에서만 MODULE_NOT_FOUND가 났다. standalone을 로컬 모드로 재빌드해 실제로 부팅·Grep 턴을 완주한다.
      # 이 잡은 패키징을 하지 않으므로 .next가 로컬 모드 산출물로 바뀌어도 무해하다(릴리스 잡은 stage-sidecar가 자기 빌드를 만든다). 맥 러너만(시간).
      - if: runner.os == 'macOS'
        run: npm run smoke:standalone

  # 실 Postgres 드릴 — test/*pg*.test.mjs는 ARGO_PG_TEST_URL이 없으면 skip이라 위 npm test에서는 전부 건너뛴다(2026-09-18 실측:
  # #585가 msgr-dm-delegation-pg 6건을 깨뜨렸는데 CI 초록). 드릴 스크립트를 그대로 돌린다 — 파일마다 별도 DB, 실패해도 끝까지.
  # 버전은 라이브 Supabase와 같은 17(supabase/config.toml major_version). 스텁 스키마(auth·storage·realtime·net)는 테스트가 세우므로
  # 순정 Postgres + contrib(pgcrypto)면 된다.
  pg-drill:
    # 리눅스 러너(빠르고 싸다). 예전엔 153KB 마이그레이션을 psql -c 한 인자로 넘겨 E2BIG(인자 하나 128KB 상한)이었다 —
    # test/helpers/pg.mjs가 큰 본문을 표준 입력(-1 -f -)으로 보내 해소. 라이브 Supabase와 같은 주 버전 17을 PGDG에서 받는다.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: PostgreSQL 17
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: psql --version && initdb --version
      # 에이전트 셸과 같은 LC_ALL=C로 돈다 — 드릴이 셸 로캘을 물려받던 회귀(SQL_ASCII 클러스터, 2026-10-03)를 여기서 잡는다.
      - run: bash scripts/billing-pg-drill.sh
        env:
          LC_ALL: C
