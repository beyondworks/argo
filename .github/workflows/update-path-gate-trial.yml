# 관문 자체 시험 — 이 브랜치(ci/update-path-gate)에만 있고 병합 전에 지운다.
# 통과: 메신저 공개 0.1.48 → 0.1.49 초안 빌드(run 37174069109), Apple Silicon·Intel — 시험 run 37190306588
# 본체: 공개 0.1.94 → PR #823 코드 빌드(0.1.99, 발행 안 함, run 37190246882) — 재시작 조각 6638이 바뀌면 여기서 실패한다
name: Update path gate (trial)

on:
  push:
    branches: [ci/update-path-gate]

permissions:
  contents: read
  actions: read

jobs:
  argo-0199:
    uses: ./.github/workflows/update-path-gate.yml
    with:
      app: argo
      run_id: '37190246882'
      matrix: '[{"os":"macos-15","arch":"aarch64-apple-darwin","platform":"darwin-aarch64"}]'
