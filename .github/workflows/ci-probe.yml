# TEMP stress (fix/windows-ci-flakes) — 안정화한 테스트를 Windows CI 조건(예열·TEMP=D:)에서 반복 실행한다. 병합 전에 삭제한다.
name: CI probe
on:
  push:
    branches: [fix/windows-ci-flakes]
permissions:
  contents: read
jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: Start-Process pwsh -WindowStyle Hidden -ArgumentList '-NoProfile', '-File', 'scripts/ci-windows-prewarm.ps1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-busybox.mjs bin
      - shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'prewarm.log'
          for ($i = 0; $i -lt 300 -and -not (Select-String -Quiet -Path $log -Pattern '^done' -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          "prewarm waited ${i}s"; Get-Content $log -ErrorAction SilentlyContinue
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: full suite once
        run: npm test
        continue-on-error: true
      - name: targeted x8 (with load)
        shell: bash
        run: |
          T="test/nsis-hooks.test.mjs test/browser-command-recover.test.mjs test/browser-isolation.test.mjs test/local-asset-import.test.mjs test/room-parallel.test.mjs test/mutex-reclaim-race.test.mjs"
          for i in 1 2 3 4 5 6 7 8; do
            node --test $T > "$RUNNER_TEMP/iter$i.txt" 2>&1; code=$?
            echo "iter $i exit=$code $(grep -E '^# (pass|fail|cancelled) ' "$RUNNER_TEMP/iter$i.txt" | tr '\n' ' ')"
            grep -E '^not ok|^# (powershell-warm|isolated)' "$RUNNER_TEMP/iter$i.txt" || true
          done
