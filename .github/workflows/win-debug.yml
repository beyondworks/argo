# 임시 — crewmail rename 경합 윈도우 재현·수정 검증 (조사 후 삭제)
name: win-debug
on: workflow_dispatch
permissions:
  contents: read
jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: repro (수정 후 — realpath-double=0 기대)
        run: node repro-rename-race.mjs
      - name: full tests
        run: npm test
      - name: mutation probe (게이트 제거 → 경합 테스트 red 기대)
        shell: bash
        run: |
          node repro-mutate.mjs
          if node --test test/crewmail.test.mjs; then
            echo "MUTANT SURVIVED — 테스트가 결함을 못 잡는다"; exit 1
          else
            echo "mutant killed — 강화된 테스트가 rename 단독 선점을 red로 잡음"
          fi
          git checkout -- src/crewmail.mjs
