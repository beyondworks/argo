name: sim-win-shell
on:
  push:
    branches: ['sim/**']
  workflow_dispatch: {}
jobs:
  sim:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: busybox-w32 (시뮬 전용 — 제품 동봉 아님, 해시는 기록만)
        shell: bash
        run: |
          mkdir -p sim-bin && curl -fsSL -o sim-bin/busybox64.exe https://frippery.org/files/busybox/busybox64.exe && sha256sum sim-bin/busybox64.exe && ls -la sim-bin
      - name: 셸 정보
        shell: bash
        run: |
          echo "bash: $(bash --version | head -1)"; echo "which bash: $(which bash)"; ls "/c/Program Files/Git/bin/" | head; cmd //c ver; cmd //c chcp
      - name: 시뮬레이션
        shell: cmd
        run: node scripts\sim-win-shell.mjs
      - uses: actions/upload-artifact@v4
        with: { name: sim-result, path: sim-result/ }
