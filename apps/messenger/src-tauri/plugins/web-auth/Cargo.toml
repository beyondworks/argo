[package]
name = "tauri-plugin-web-auth"
version = "0.1.0"
description = "iOS 로그인 창(ASWebAuthenticationSession) — 기본 브라우저와 무관하게 OAuth 콜백을 앱이 직접 받는다"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-web-auth"
publish = false

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
