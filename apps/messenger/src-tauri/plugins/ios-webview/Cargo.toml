[package]
name = "tauri-plugin-ios-webview"
version = "0.1.0"
description = "iOS 웹뷰 다듬기 — 키보드 위 폼 보조 막대(↑↓✓) 숨김, 네이티브 웹뷰 바탕을 테마 색으로"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-ios-webview"
publish = false

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
