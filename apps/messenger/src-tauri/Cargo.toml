[package]
name = "argo-messenger"
version = "0.1.2"
description = "Argo Messenger — 사람과 크루가 같은 채널에서 일하는 조직 공간"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "argo_messenger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
getrandom = "0.2" # pair.rs 페어링 code·verifier — OS CSPRNG
# 인앱 업데이터(릴리스 latest.json 대조)·설치 뒤 재시작 — 데스크톱만(Argo 앱과 같은 서명 키)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
