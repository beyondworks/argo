[package]
name = "argo-messenger"
version = "0.1.31"
description = "Argo Messenger — 사람과 크루가 같은 채널에서 일하는 조직 공간"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "argo_messenger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2" # OS 알림 — 웹뷰엔 Notification API가 없어 데스크톱 알림이 한 번도 울린 적 없었다(2026-09-11 밤)
getrandom = "0.2" # pair.rs 페어링 code·verifier — OS CSPRNG
# 인앱 업데이터(릴리스 latest.json 대조)·설치 뒤 재시작 — 데스크톱만(Argo 앱과 같은 서명 키)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2" # 창 위치·크기 기억(D53, T8) — 표시 여부는 빼고 저장·복원(닫기=가리기라 숨긴 채 뜨지 않게)

# macOS OS 알림 — UNUserNotificationCenter(notify_mac.rs). 세 크레이트 모두 이미 잠금 파일에 있던 판(wry·tao 경유)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-deep-link = "2"
tauri-plugin-push-notifications = "0.1" # APNs·FCM 기기 토큰 + 알림 탭(모바일 푸시, 2026-09-12) — 발송은 엣지 msgr-push

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-web-auth = { path = "plugins/web-auth" } # 로그인 창 — Chrome 등 기본 브라우저가 콜백을 앱에 안 넘기는 문제(2026-09-10)

# tao 0.35.3 + iOS 씬 구성 해제 후 사용 수정 1줄(tao 0.36.0에서 고쳐졌으나 tauri 2.x는 tao ^0.35만 받는다).
# iOS 27에서 씬 생명주기가 필수가 된 뒤 이 경로가 실행돼 TestFlight 0.1.27.2가 실행 즉시 죽었다(2026-09-17). tauri가 tao 0.36+를 받게 되면 이 패치를 지운다.
[patch.crates-io]
tao = { path = "patches/tao" }
# Xcode 27 hides the shared SwiftRs C exports; restore them once in the Tauri archive.
# Upstream fix: https://github.com/Brendonovich/swift-rs/pull/80
swift-rs = { git = "https://github.com/alchaplinsky/swift-rs", rev = "aaf38d45ab3a4b10a5af3a3dbc64424e998fae8c" }
