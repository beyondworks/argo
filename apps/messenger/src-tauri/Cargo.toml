[package]
name = "argo-messenger"
version = "0.1.7"
description = "Argo Messenger — 사람과 크루가 같은 채널에서 일하는 조직 공간"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "argo_messenger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2" # OS 알림 — 웹뷰엔 Notification API가 없어 데스크톱 알림이 한 번도 울린 적 없었다(2026-09-11 밤)
getrandom = "0.2" # pair.rs 페어링 code·verifier — OS CSPRNG
# 인앱 업데이터(릴리스 latest.json 대조)·설치 뒤 재시작 — 데스크톱만(Argo 앱과 같은 서명 키)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-deep-link = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-web-auth = { path = "plugins/web-auth" } # 로그인 창 — Chrome 등 기본 브라우저가 콜백을 앱에 안 넘기는 문제(2026-09-10)
