[package]
name = "argo-messenger"
version = "0.1.0"
description = "Argo Messenger — 사람과 크루가 같은 채널에서 일하는 조직 공간"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "argo_messenger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
