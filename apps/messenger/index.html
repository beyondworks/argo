<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Argo Messenger</title>
    <link rel="icon" href="/icon.svg" />
    <!-- 테마 부팅 — Argo 앱(app/layout.jsx themeBoot)과 같은 키, 기본값만 linen(app-root.jsx defaultTheme와 동일 — test/theme-boot-default가 잠근다). 첫 그리기 전에 적용해 번쩍임을 막는다 -->
    <script>try{var t=localStorage.getItem('argo-theme')||'linen';if(t!=='argo')document.documentElement.dataset.theme=t}catch(e){}</script>
    <!-- 시작 스플래시 정적 바탕(#1F1E1B) — style 속성이 아니라 head의 CSS 파일로(설치본 CSP nonce에 막히지 않게, src/splash.css 주석) -->
    <link rel="stylesheet" href="/src/splash.css" />
  </head>
  <body class="argo-messenger">
    <!-- 시작 스플래시 바탕 — 첫 페인트부터 네이티브 시작 화면과 같은 색을 이어 간다(색·8초 안전 사라짐은 src/splash.css).
         src/splash.js가 이어받아 로고를 그리고 닫는다. 이 파일에는 style 요소도 style 속성도 두지 않는다(test/splash.test.mjs) -->
    <div id="argo-splash" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
