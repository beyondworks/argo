<!doctype html><html data-theme="linen-light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/app/globals.css"><link rel="stylesheet" href="/apps/messenger/src/styles.css"><title>Mobile layout fixture — no account or network actions</title></head><body class="argo-messenger"><div class="shell msgr-shell"><aside class="side msgr-side"><div class="msgr-brand">ARGO<button class="msgr-rail-close" aria-label="Close navigation">×</button></div><button class="msgr-org">Mobile UI fixture</button><div class="msgr-railbody"><div class="msgr-list"><div class="msgr-railrow"><button class="item"># Crew</button><button class="more">…</button></div><button class="item">@ Shuri</button><button class="item">@ Carmack</button></div></div><div class="msgr-foot"><button class="me">User fixture</button><button class="btn">Settings</button></div></aside><main class="msgr-main"><div class="msgr-top"><button class="msgr-menu" aria-label="Open navigation">☰</button><button class="title msgr-titlebtn"># Crew</button><span class="msgr-hchips"><button class="msgr-hchip">♧</button><button class="msgr-hchip">◇</button></span><div class="msgr-seg"><button class="active">전체</button><button>멘션</button><button>결재</button><button>에이전트</button></div></div><div class="msgr-thread"><div class="msgr-spine"><div class="msgr-row"><span class="msgr-av crew">슈</span><div><div class="who">슈리<span class="role">기술팀 · Mobile layout fixture</span></div><div class="msgr-sheet"><div class="md"><p>검수용 화면입니다. 실제 메시지를 보내지 않습니다.</p><p>작은 화면에서도 같은 채널의 대화를 읽고 답장합니다.</p><button class="msgr-file">quarterly_project_analysis_very_long_attachment_filename.pdf</button></div></div><div class="msgr-acts"><button>답장</button><button>반응</button></div></div></div><div class="msgr-mine"><div class="bubble">@슈리 @카맥 자료 확인 후 답변해 주세요.</div></div><div class="msgr-row"><span class="msgr-av crew">카</span><div class="msgr-slip pending"><div class= el><label class="msgr-field"><svg class="mi" width="16" height="16"></svg><input placeholder="공개 클라이언트 키"></label><div class="row"><button type="button" class="btn sm btn-primary">이 서버로 연결</button><button type="button" class="btn sm ghost">기본 서버</button></div></details><div class="foot"><svg class="mi" width="13" height="13"></svg><span style="flex:1">초대 링크로 오셨다면 로그인 뒤 자동으로 조직에 들어갑니다.</span><button type="button" class="btn sm">EN</button></div></div></form></div></template><script>
