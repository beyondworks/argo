[package]
name = "argo-office"
version = "0.1.0"
description = "Argo Office desktop"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2" # 새 메일 OS 알림(15차) — 웹 Notification API를 그대로 채워 넣는다(오피스가 열려 있을 때만)
