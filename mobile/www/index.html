<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argo</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f0e3; --card: #fcfaf2; --fg: #221e15; --fg2: #585240; --fg3: #8a8368; --line: rgba(74,58,20,.22); --gold: #e7bc63; --gold-fg: #2a2109; --danger: #a24a33; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161c; --card: #1c1f27; --fg: #f1ede2; --fg2: #b8b2a2; --fg3: #7f7a6c; --line: rgba(231,188,99,.22); } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, "Pretendard", system-ui, sans-serif; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
  .card { width: min(380px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px 22px; display: grid; gap: 14px; text-align: center; }
  h1 { font-size: 18px; margin: 4px 0 0; }
  p { margin: 0; color: var(--fg2); font-size: 13.5px; }
  .logo { font: 600 14px/1 ui-monospace, Menlo, monospace; letter-spacing: .18em; }
  input { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); padding: 0 12px; font-size: 15px; }
  input.code { font: 22px/1 ui-monospace, Menlo, monospace; letter-spacing: 6px; text-align: center; text-transform: uppercase; }
  button { height: 46px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: 15px; font-weight: 600; }
  button.primary { background: var(--gold); color: var(--gold-fg); border-color: transparent; }
  button:disabled { opacity: .5; }
  .err { color: var(--danger); font-size: 13px; }
  .hint { font-size: 12px; color: var(--fg3); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="card" id="connect" hidden>
    <div class="logo">✦ ARGO</div>
    <h1 data-i18n="title">PC의 아르고에 연결</h1>
    <p data-i18n="help">PC 설정 → 휴대폰에서 열기의 QR을 비추거나, 주소와 코드를 입력하세요.</p>
    <button class="primary" id="scan" type="button" data-i18n="scan">QR 스캔</button>
    <p class="hint" data-i18n="or">또는 직접 입력</p>
    <input id="addr" inputmode="url" autocapitalize="none" autocorrect="off" placeholder="192.168.0.12:3031">
    <input id="code" class="code" maxlength="8" autocapitalize="characters" autocomplete="one-time-code" placeholder="ABC123">
    <button id="go" type="button" data-i18n="connect">연결</button>
    <p class="err" id="err" role="alert" hidden></p>
    <p class="hint" id="last" hidden></p>
  </div>
  <div id="boot"><p data-i18n="probing">PC를 찾는 중…</p></div>
  <script src="connect.js"></script>
</body>
</html>
